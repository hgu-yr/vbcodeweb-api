# Forgejo / Gitea Actions（语法兼容 GitHub Actions）
# 仓库 Secrets 需配置：SSH_KEY（部署私钥）、SERVER（服务器 IP/域名）
name: deploy

on:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 构建后端
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o vbcodeweb .
      - name: 上传并重启
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          echo "$SSH_KEY" > key && chmod 600 key
          scp -i key -o StrictHostKeyChecking=no vbcodeweb deploy@$SERVER:/opt/vbcodeweb/vbcodeweb.new
          ssh -i key -o StrictHostKeyChecking=no deploy@$SERVER \
            'mv /opt/vbcodeweb/vbcodeweb.new /opt/vbcodeweb/vbcodeweb && sudo systemctl restart vbcodeweb'

  frontend:
    runs-on: docker
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: npm ci
      - name: 构建前端
        env:
          NEXT_PUBLIC_API_BASE: https://api.example.com
        run: npm run build
      - name: 打包 standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar czf web.tar.gz -C .next/standalone .
      - name: 上传并重启
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER: ${{ secrets.SERVER }}
        run: |
          echo "$SSH_KEY" > key && chmod 600 key
          scp -i key -o StrictHostKeyChecking=no web.tar.gz deploy@$SERVER:/tmp/web.tar.gz
          ssh -i key -o StrictHostKeyChecking=no deploy@$SERVER \
            'rm -rf /opt/vbcodeweb-web/* && tar xzf /tmp/web.tar.gz -C /opt/vbcodeweb-web && sudo systemctl restart vbcodeweb-web'
